<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Årshjul – rotera</title>
<style>
  :root{
    --bg:#f4f2ee; --panel:#ffffff; --text:#1b1b1b; --sub:#6b6b6b; --accent:#1371b5;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181c; --panel:#1f242b; --text:#f2f2f2; --sub:#9aa2ac; --accent:#4da3e0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181c; --panel:#1f242b; --text:#f2f2f2; --sub:#9aa2ac; --accent:#4da3e0;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  html,body{
    height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100%; padding:24px; gap:18px; text-align:center;
  }
  h1{ font-size:2rem; font-weight:600; margin:0; }
  p.hint{ margin:0; color:var(--sub); font-size:.85rem; max-width:420px; }

  /* Stage: defines the interactive hit-area and centers the hub in the middle of it */
  .stage{
    position:relative;
    --base:calc(min(92vw, 82vh, 920px) * 1.2);
    --z:1;                        /* zoomnivå, sätts från JavaScript */
    width:100%;
    max-width:1400px;
    height:var(--base);
    touch-action:none;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    overflow:hidden;              /* inzoomat innehåll klipps vid kanten */
    border-radius:12px;
  }
  .stage.pan-mode{ cursor:move; }
  .stage:active{ cursor:grabbing; }

  /* wrap is a zero-size anchor pinned to the exact center of .stage.
     It is the pivot point, and it is rotated. */
  .wrap{
    position:absolute;
    left:50%; top:50%;
    width:0; height:0;
    transform-origin:0 0;
    will-change:transform;
  }

  /* The image is shifted so that its hub circle's center lands exactly
     on wrap's (0,0) pivot point — i.e. the center of .stage.
     This is a flattened raster (PNG) so all text renders as fixed pixels
     and never changes appearance regardless of which fonts are installed. */
  #wheel{
    position:absolute;
    left:0; top:0;
    /* Zoom görs genom att ändra bildens layoutbredd (inte transform: scale),
       så att webbläsaren ritar om vektorbilden skarpt vid varje zoomnivå. */
    width:calc(var(--base) * var(--z));
    height:auto;
    max-width:none;
    transform: translate(-57.679%, -50.279%);
    pointer-events:none;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.18));
  }

  .controls{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
  }
  button{
    font:inherit; font-size:.85rem; padding:8px 14px; border-radius:999px;
    border:1px solid var(--sub); background:var(--panel); color:var(--text);
    cursor:pointer;
  }
  button:active{ transform:scale(0.96); }
  .angle, .zoomval{
    font-variant-numeric:tabular-nums; color:var(--sub); font-size:.85rem; min-width:4.5em;
  }
  button.round{ width:38px; height:38px; padding:0; font-size:1.2rem; line-height:1; }
  button[aria-pressed="true"]{ background:var(--accent); color:#fff; border-color:var(--accent); }
  input[type=range]{ width:140px; accent-color:var(--accent); }
  .group{ display:flex; align-items:center; gap:8px; }
</style>
</head>

  <div class="controls">
    <div class="group" role="group" aria-label="Zoom">
      <button class="round" id="zoomOut" aria-label="Zooma ut" title="Zooma ut (−)">−</button>
      <input type="range" id="zoomSlider" min="1" max="6" step="0.05" value="1" aria-label="Zoomnivå">
      <button class="round" id="zoomIn" aria-label="Zooma in" title="Zooma in (+)">+</button>
      <span class="zoomval" id="zoomLabel">100%</span>
    </div>
    <button id="panToggle" aria-pressed="false" title="Växla mellan att rotera och flytta när du drar">Dra: Rotera</button>
    <button id="reset">Återställ</button>
    <span class="angle" id="angleLabel">0°</span>
  </div>
<script>
(function(){
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('wrap');
  const angleLabel = document.getElementById('angleLabel');
  const zoomLabel = document.getElementById('zoomLabel');
  const slider = document.getElementById('zoomSlider');
  const panToggle = document.getElementById('panToggle');
  const resetBtn = document.getElementById('reset');

  const MIN_Z = 1, MAX_Z = 6;
  let angle = 0;          // rotation i grader
  let zoom = 1;           // 1 = 100 %
  let panX = 0, panY = 0; // navets förskjutning från scenens mitt (px)
  let panMode = false;    // true = enfingers-drag flyttar i stället för att rotera

  function render(){
    stage.style.setProperty('--z', zoom);
    wrap.style.transform = 'translate(' + panX + 'px,' + panY + 'px) rotate(' + angle + 'deg)';
    const norm = ((angle % 360) + 360) % 360;
    angleLabel.textContent = Math.round(norm) + '°';
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    slider.value = zoom;
  }

  // Håll navet inom rimligt avstånd så att hjulet inte kan tappas bort utanför bild.
  function clampPan(){
    const r = stage.clientHeight * 0.5 * zoom;
    panX = Math.max(-r, Math.min(r, panX));
    panY = Math.max(-r, Math.min(r, panY));
    if(zoom <= 1.001){ panX = 0; panY = 0; }
  }

  // Punkt i förhållande till scenens mitt.
  function localPoint(clientX, clientY){
    const rect = stage.getBoundingClientRect();
    return { x: clientX - rect.left - rect.width / 2, y: clientY - rect.top - rect.height / 2 };
  }

  // Zooma så att punkten p (lokala koordinater) ligger kvar under pekaren.
  function zoomTo(newZoom, p){
    newZoom = Math.max(MIN_Z, Math.min(MAX_Z, newZoom));
    if(!p) p = { x: 0, y: 0 };
    const k = newZoom / zoom;
    panX = p.x - (p.x - panX) * k;
    panY = p.y - (p.y - panY) * k;
    zoom = newZoom;
    clampPan();
    render();
  }

  function pointerAngle(x, y){
    const rect = wrap.getBoundingClientRect();
    return Math.atan2(y - rect.top, x - rect.left) * 180 / Math.PI;
  }

  // --- Scroll: rotera, eller zooma med Ctrl/⌘ (även nypgest på styrplatta) ---
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    if(e.ctrlKey || e.metaKey){
      // Begränsa steget så att ett mushjulsklick inte zoomar för långt på en gång.
      const d = Math.max(-50, Math.min(50, e.deltaY));
      zoomTo(zoom * Math.exp(-d * 0.004), localPoint(e.clientX, e.clientY));
    } else {
      const delta = (e.deltaY !== 0 ? e.deltaY : e.deltaX);
      angle += delta * 0.35;
      render();
    }
  }, { passive:false });

  // --- Pekare: ett finger/mus = rotera eller flytta, två fingrar = nyp-zoom + flytta ---
  const pointers = new Map();
  let mode = null, start = {};

  function beginSingle(e, forcePan){
    const p = [...pointers.values()][0];
    mode = (forcePan || panMode || (e && (e.shiftKey || e.button === 1))) ? 'pan' : 'rotate';
    start = { x: p.x, y: p.y, angle: angle, panX: panX, panY: panY, pa: pointerAngle(p.x, p.y) };
  }
  function beginPinch(){
    const [a, b] = [...pointers.values()];
    const mid = localPoint((a.x + b.x) / 2, (a.y + b.y) / 2);
    mode = 'pinch';
    start = { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: zoom, mid: mid, panX: panX, panY: panY };
  }

  stage.addEventListener('pointerdown', function(e){
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 1) beginSingle(e);
    else if(pointers.size === 2) beginPinch();
  });

  stage.addEventListener('pointermove', function(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(mode === 'rotate'){
      angle = start.angle + (pointerAngle(e.clientX, e.clientY) - start.pa);
      render();
    } else if(mode === 'pan'){
      panX = start.panX + (e.clientX - start.x);
      panY = start.panY + (e.clientY - start.y);
      clampPan(); render();
    } else if(mode === 'pinch' && pointers.size >= 2){
      const [a, b] = [...pointers.values()];
      const mid = localPoint((a.x + b.x) / 2, (a.y + b.y) / 2);
      const z = Math.max(MIN_Z, Math.min(MAX_Z, start.zoom * Math.hypot(a.x - b.x, a.y - b.y) / start.dist));
      const k = z / start.zoom;
      // Zooma kring startmittpunkten och följ sedan fingrarnas förflyttning.
      panX = start.mid.x - (start.mid.x - start.panX) * k + (mid.x - start.mid.x);
      panY = start.mid.y - (start.mid.y - start.panY) * k + (mid.y - start.mid.y);
      zoom = z;
      clampPan(); render();
    }
  });

  function endPointer(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if(pointers.size === 1) beginSingle(null, mode === 'pinch'); // efter nyp: fortsätt flytta
    else if(pointers.size === 0) mode = null;
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  // Dubbelklick zoomar in där du klickar; Shift + dubbelklick zoomar ut.
  stage.addEventListener('dblclick', function(e){
    zoomTo(e.shiftKey ? zoom / 2 : zoom * 2, localPoint(e.clientX, e.clientY));
  });

  // --- Knappar och reglage ---
  document.getElementById('zoomIn').addEventListener('click', function(){ zoomTo(zoom * 1.25); });
  document.getElementById('zoomOut').addEventListener('click', function(){ zoomTo(zoom / 1.25); });
  slider.addEventListener('input', function(){ zoomTo(parseFloat(slider.value)); });

  panToggle.addEventListener('click', function(){
    panMode = !panMode;
    panToggle.setAttribute('aria-pressed', panMode);
    panToggle.textContent = panMode ? 'Dra: Flytta' : 'Dra: Rotera';
    stage.classList.toggle('pan-mode', panMode);
  });

  resetBtn.addEventListener('click', function(){
    angle = 0; zoom = 1; panX = 0; panY = 0;
    render();
  });

  // --- Tangentbord: + / − / 0 för zoom, piltangenter för att flytta ---
  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT') return;
    const step = 60;
    if(e.key === '+' || e.key === '=') zoomTo(zoom * 1.25);
    else if(e.key === '-' || e.key === '_') zoomTo(zoom / 1.25);
    else if(e.key === '0') resetBtn.click();
    else if(e.key.startsWith('Arrow')){
      if(e.key === 'ArrowLeft') panX += step;
      if(e.key === 'ArrowRight') panX -= step;
      if(e.key === 'ArrowUp') panY += step;
      if(e.key === 'ArrowDown') panY -= step;
      clampPan(); render(); e.preventDefault();
    } else return;
  });

  window.addEventListener('resize', function(){ clampPan(); render(); });

  render();
})();
</script>
